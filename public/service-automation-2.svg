<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12141C" />
      <stop offset="100%" stop-color="#0A0B10" />
    </radialGradient>

    <!-- Lime Green Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Accents -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD400" />
      <stop offset="100%" stop-color="#C6FF00" />
    </linearGradient>

    <!-- Glassmorphic Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes floatElement {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Animation Classes */
    .bg-rect { fill: url(#bgGrad); }
    .grid-overlay { fill: url(#grid); }
    .gear-main {
      transform-origin: 300px 300px;
      animation: spinClockwise 20s linear infinite;
    }
    .gear-sub {
      transform-origin: 430px 220px;
      animation: spinCounterClockwise 12s linear infinite;
    }
    .gear-mini {
      transform-origin: 190px 390px;
      animation: spinCounterClockwise 8s linear infinite;
    }
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .flow-line {
      stroke: url(#limeGrad);
      stroke-dasharray: 10 15;
      animation: dashFlow 2s linear infinite;
    }
    .float-panel {
      animation: floatElement 6s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="600" class="bg-rect" />
  <rect width="600" height="600" class="grid-overlay" />

  <!-- Central Glow -->
  <circle cx="300" cy="300" r="180" fill="#8FD400" opacity="0.04" filter="url(#neonGlow)" />

  <!-- Animated flow lines -->
  <path d="M 100 150 L 300 150 L 300 300" fill="none" stroke-width="3" class="flow-line" />
  <path d="M 300 300 L 430 300 L 430 220" fill="none" stroke-width="3" class="flow-line" style="animation-duration: 2.5s;" />
  <path d="M 190 390 L 190 300 L 300 300" fill="none" stroke-width="2.5" class="flow-line" style="animation-duration: 1.8s;" />
  <path d="M 300 300 L 300 480 L 500 480" fill="none" stroke-width="3" class="flow-line" style="animation-duration: 3s;" />

  <!-- Gears Group -->
  <g filter="url(#neonGlow)">
    <!-- Main Gear -->
    <g class="gear-main">
      <circle cx="300" cy="300" r="90" fill="none" stroke="url(#limeGrad)" stroke-width="12" />
      <circle cx="300" cy="300" r="60" fill="none" stroke="rgba(143, 212, 0, 0.4)" stroke-width="2" />
      <!-- Teeth -->
      <path d="M 300 195 L 300 215 M 300 385 L 300 405 M 195 300 L 215 300 M 385 300 L 405 300" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" />
      <path d="M 226 226 L 240 240 M 360 360 L 374 374 M 226 374 L 240 360 M 360 226 L 374 240" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="300" cy="300" r="20" fill="#12141C" stroke="url(#limeGrad)" stroke-width="4" />
    </g>

    <!-- Sub Gear -->
    <g class="gear-sub">
      <circle cx="430" cy="220" r="55" fill="none" stroke="url(#limeGrad)" stroke-width="8" opacity="0.8" />
      <!-- Teeth -->
      <path d="M 430 155 L 430 170 M 430 270 L 430 285 M 365 220 L 380 220 M 480 220 L 495 220" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8" />
      <circle cx="430" cy="220" r="12" fill="#12141C" stroke="url(#limeGrad)" stroke-width="3" />
    </g>

    <!-- Mini Gear -->
    <g class="gear-mini">
      <circle cx="190" cy="390" r="40" fill="none" stroke="url(#limeGrad)" stroke-width="6" opacity="0.7" />
      <!-- Teeth -->
      <path d="M 190 342 L 190 354 M 190 426 L 190 438 M 142 390 L 154 390 M 226 390 L 238 390" stroke="url(#limeGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7" />
      <circle cx="190" cy="390" r="10" fill="#12141C" stroke="url(#limeGrad)" stroke-width="3" />
    </g>
  </g>

  <!-- Interactive Nodes (glowing dots) -->
  <g>
    <circle cx="300" cy="150" r="8" fill="#C6FF00" class="pulse-node" filter="url(#neonGlow)" />
    <circle cx="100" cy="150" r="6" fill="#C6FF00" />
    <circle cx="430" cy="300" r="8" fill="#C6FF00" class="pulse-node" filter="url(#neonGlow)" style="animation-delay: 1.5s;" />
    <circle cx="500" cy="480" r="7" fill="#C6FF00" />
  </g>

  <!-- Floating Glassmorphic UI Card -->
  <g class="float-panel" transform="translate(360, 360)">
    <!-- Glass background -->
    <rect width="180" height="100" rx="16" fill="rgba(18, 20, 28, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" style="backdrop-filter: blur(12px);" />
    <rect width="180" height="100" rx="16" fill="none" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.3" />
    
    <!-- Pulse Light -->
    <circle cx="30" cy="30" r="6" fill="#C6FF00" class="pulse-node" filter="url(#neonGlow)" />
    
    <!-- Dummy Text Lines -->
    <rect x="50" y="24" width="100" height="8" rx="4" fill="rgba(255, 255, 255, 0.8)" />
    <rect x="50" y="44" width="70" height="6" rx="3" fill="rgba(255, 255, 255, 0.3)" />
    
    <!-- Mini progress bar -->
    <rect x="30" y="70" width="120" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />
    <rect x="30" y="70" width="85" height="6" rx="3" fill="url(#limeGrad)">
      <animate attributeName="width" values="10;120;10" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Second Floating Glass Card (Top Left) -->
  <g class="float-panel" transform="translate(60, 60)" style="animation-delay: -3s;">
    <rect width="150" height="60" rx="12" fill="rgba(18, 20, 28, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="25" cy="30" r="10" fill="none" stroke="url(#limeGrad)" stroke-width="2" />
    <path d="M 21 30 L 29 30 M 25 26 L 25 34" stroke="url(#limeGrad)" stroke-width="2" />
    <rect x="45" y="22" width="80" height="6" rx="3" fill="rgba(255, 255, 255, 0.6)" />
    <rect x="45" y="34" width="50" height="4" rx="2" fill="rgba(255, 255, 255, 0.2)" />
  </g>
</svg>
