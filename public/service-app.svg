<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD400"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    @keyframes floatX { 0%,100%{transform:translateX(0);} 50%{transform:translateX(6px);} }
    @keyframes pulse { 0%,100%{opacity:.3;} 50%{opacity:1;} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px);} to{opacity:1;transform:translateX(0);} }
    @keyframes notifPop {
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.08);}
    }
    @keyframes connectPulse {
      0%{stroke-dashoffset:100; opacity:0;}
      50%{opacity:1;}
      100%{stroke-dashoffset:0; opacity:0;}
    }
    .float { animation:float 6s ease-in-out infinite; }
    .float2 { animation:float 7s ease-in-out infinite 1.2s; }
    .floatX { animation:floatX 5s ease-in-out infinite .5s; }
    .pulse { animation:pulse 2.5s ease-in-out infinite; }
    .pulse2 { animation:pulse 2.5s ease-in-out infinite .8s; }
    .notif { animation:notifPop 3s ease-in-out infinite; }
    .connect-line {
      stroke-dasharray: 8 8;
      animation: connectPulse 2.5s linear infinite;
    }
  </style>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <circle cx="300" cy="280" r="180" fill="#8FD400" opacity="0.03" filter="url(#glow)"/>

  <!-- Connection lines between devices -->
  <line x1="200" y1="230" x2="300" y2="310" stroke="rgba(143,212,0,0.3)" stroke-width="1.5" class="connect-line"/>
  <line x1="400" y1="200" x2="300" y2="310" stroke="rgba(143,212,0,0.3)" stroke-width="1.5" class="connect-line" style="animation-delay:.8s;"/>
  <line x1="300" y1="420" x2="300" y2="310" stroke="rgba(143,212,0,0.3)" stroke-width="1.5" class="connect-line" style="animation-delay:1.6s;"/>

  <!-- Central Hub Node -->
  <circle cx="300" cy="310" r="22" fill="#12141C" stroke="url(#limeGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="300" cy="310" r="10" fill="url(#limeGrad)" class="pulse" filter="url(#glow)"/>

  <!-- Desktop Screen -->
  <g class="float">
    <rect x="120" y="115" width="160" height="110" rx="12" fill="rgba(18,20,28,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="120" y="115" width="160" height="110" rx="12" fill="none" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.4"/>
    <!-- Screen content -->
    <rect x="130" y="128" width="140" height="28" rx="6" fill="rgba(143,212,0,0.08)"/>
    <rect x="136" y="134" width="80" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="136" y="144" width="55" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <!-- Mini chart -->
    <polyline points="130,190 148,175 166,180 184,160 202,165 220,148 260,145"
      fill="none" stroke="url(#limeGrad)" stroke-width="2" stroke-linecap="round">
    </polyline>
    <rect x="130" y="195" width="140" height="1" fill="rgba(255,255,255,0.07)"/>
    <!-- Stand -->
    <rect x="190" y="225" width="20" height="14" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="175" y="239" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- Mobile Screen -->
  <g class="float2">
    <rect x="350" y="90" width="110" height="190" rx="16" fill="rgba(18,20,28,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="350" y="90" width="110" height="190" rx="16" fill="none" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.35"/>
    <!-- Notch -->
    <rect x="390" y="97" width="30" height="8" rx="4" fill="rgba(0,0,0,0.6)"/>
    <!-- App screen content -->
    <rect x="362" y="118" width="86" height="12" rx="6" fill="rgba(143,212,0,0.15)" stroke="rgba(143,212,0,0.3)" stroke-width="1"/>
    <text x="405" y="128" font-family="monospace" font-size="7" fill="#C6FF00" text-anchor="middle">easydigia.app</text>
    <!-- App cards -->
    <rect x="362" y="138" width="86" height="38" rx="8" fill="rgba(143,212,0,0.07)" stroke="rgba(143,212,0,0.2)" stroke-width="1"/>
    <circle cx="374" cy="155" r="6" fill="url(#limeGrad)" opacity="0.8"/>
    <rect x="384" y="150" width="55" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="384" y="160" width="38" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

    <rect x="362" y="182" width="86" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="370" y="194" width="70" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="370" y="204" width="50" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

    <rect x="362" y="226" width="86" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="370" y="238" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="370" y="248" width="40" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

    <!-- Home indicator -->
    <rect x="388" y="274" width="34" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Tablet Screen -->
  <g transform="translate(155,390)" class="floatX">
    <rect width="290" height="160" rx="16" fill="rgba(18,20,28,0.88)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect width="290" height="160" rx="16" fill="none" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.3"/>
    <!-- Camera dot -->
    <circle cx="145" cy="10" r="4" fill="rgba(255,255,255,0.2)"/>
    <!-- App grid inside -->
    <rect x="16" y="26" width="80" height="50" rx="10" fill="rgba(143,212,0,0.08)" stroke="rgba(143,212,0,0.2)" stroke-width="1"/>
    <rect x="24" y="36" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.6)"/>
    <rect x="24" y="46" width="65" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="24" y="56" width="45" height="5" rx="2.5" fill="rgba(143,212,0,0.6)"/>

    <rect x="106" y="26" width="80" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="114" y="36" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="114" y="46" width="65" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/>

    <rect x="196" y="26" width="80" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="226" cy="46" r="10" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="226" cy="46" r="4" fill="url(#limeGrad)" class="pulse2"/>

    <!-- Separator -->
    <line x1="16" y1="90" x2="274" y2="90" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Data row -->
    <rect x="16" y="102" width="258" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="16" y="114" width="180" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="16" y="125" width="220" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>

    <!-- Lime progress bar -->
    <rect x="16" y="138" width="258" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect x="16" y="138" height="6" rx="3" fill="url(#limeGrad)">
      <animate attributeName="width" values="20;258;20" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Notification badge -->
  <g class="notif" transform="translate(440,90)">
    <circle r="14" cx="14" cy="14" fill="rgba(143,212,0,0.15)" stroke="url(#limeGrad)" stroke-width="1.5"/>
    <text x="14" y="18" font-family="monospace" font-size="11" fill="#C6FF00" text-anchor="middle" font-weight="bold">3</text>
  </g>
</svg>
