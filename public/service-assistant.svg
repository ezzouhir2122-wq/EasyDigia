<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD400"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
    @keyframes typeIn {
      0%{width:0} 40%{width:160px} 60%{width:160px} 100%{width:0}
    }
    @keyframes msgAppear {
      0%,30%{opacity:0;transform:translateY(8px);}
      50%,90%{opacity:1;transform:translateY(0);}
      100%{opacity:0;}
    }
    @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out infinite 1.5s; }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.5s ease-in-out infinite .8s; }
    .orbit { transform-origin:300px 220px; animation:spin 18s linear infinite; }
  </style>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <circle cx="300" cy="220" r="160" fill="#8FD400" opacity="0.04" filter="url(#glow)"/>

  <!-- Orbit ring -->
  <circle cx="300" cy="220" r="130" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g class="orbit">
    <circle cx="170" cy="220" r="8" fill="#C6FF00" filter="url(#glow)"/>
    <circle cx="430" cy="220" r="6" fill="#8FD400" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- Central AI Head (abstract) -->
  <g class="float">
    <!-- Head shape -->
    <ellipse cx="300" cy="200" rx="70" ry="80" fill="#12141C" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <!-- Eye Left -->
    <circle cx="275" cy="185" r="10" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="275" cy="185" r="4" fill="#C6FF00" class="pulse" filter="url(#glow)"/>
    <!-- Eye Right -->
    <circle cx="325" cy="185" r="10" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="325" cy="185" r="4" fill="#C6FF00" class="pulse2" filter="url(#glow)"/>
    <!-- Mouth / Processing bar -->
    <rect x="268" y="216" width="64" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect x="268" y="216" height="6" rx="3" fill="url(#limeGrad)">
      <animate attributeName="width" values="0;64;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Neural lines at top -->
    <line x1="300" y1="120" x2="300" y2="145" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="300" cy="115" r="5" fill="#C6FF00" filter="url(#glow)" class="pulse"/>
    <line x1="240" y1="135" x2="260" y2="155" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="360" y1="135" x2="340" y2="155" stroke="url(#limeGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Chat Bubble — Agenda -->
  <g class="float2" transform="translate(60,290)">
    <rect width="180" height="75" rx="14" fill="rgba(18,20,28,0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect width="180" height="75" rx="14" fill="none" stroke="url(#limeGrad)" stroke-width="1" opacity="0.25"/>
    <!-- Tail -->
    <polygon points="20,75 40,75 30,92" fill="rgba(18,20,28,0.85)"/>
    <!-- Content -->
    <circle cx="22" cy="22" r="6" fill="url(#limeGrad)" opacity="0.9"/>
    <rect x="36" y="16" width="120" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>
    <rect x="36" y="28" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="10" y="48" width="160" height="1" fill="rgba(255,255,255,0.06)"/>
    <rect x="10" y="56" width="100" height="5" rx="2.5" fill="rgba(143,212,0,0.6)"/>
    <rect x="10" y="64" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Chat Bubble — Email summary -->
  <g transform="translate(360,280)" style="animation:float 5.5s ease-in-out infinite 2s;">
    <rect width="180" height="80" rx="14" fill="rgba(18,20,28,0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect width="180" height="80" rx="14" fill="none" stroke="url(#limeGrad)" stroke-width="1" opacity="0.25"/>
    <polygon points="160,80 180,80 170,97" fill="rgba(18,20,28,0.85)"/>
    <!-- Mail icon -->
    <rect x="10" y="14" width="24" height="16" rx="3" fill="none" stroke="url(#limeGrad)" stroke-width="1.5"/>
    <polyline points="10,14 22,24 34,14" fill="none" stroke="url(#limeGrad)" stroke-width="1.5"/>
    <rect x="42" y="16" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="42" y="26" width="80" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="10" y="46" width="160" height="1" fill="rgba(255,255,255,0.06)"/>
    <!-- Status -->
    <circle cx="20" cy="62" r="4" fill="#C6FF00" class="pulse"/>
    <rect x="30" y="58" width="130" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="30" y="67" width="90" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Daily summary card -->
  <g transform="translate(150,420)">
    <rect width="300" height="120" rx="18" fill="rgba(18,20,28,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect width="300" height="120" rx="18" fill="none" stroke="url(#limeGrad)" stroke-width="1" opacity="0.2"/>
    <text x="18" y="28" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">📋 SYNTHÈSE QUOTIDIENNE</text>
    <!-- Animated typing line -->
    <rect x="18" y="40" height="7" rx="3.5" fill="url(#limeGrad)" opacity="0.8">
      <animate attributeName="width" values="10;180;10" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="54" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="18" y="66" width="100" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="18" y="78" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
    <!-- Priority badge -->
    <rect x="200" y="90" width="85" height="20" rx="10" fill="rgba(143,212,0,0.15)" stroke="rgba(143,212,0,0.4)" stroke-width="1"/>
    <text x="242" y="104" font-family="monospace" font-size="9" fill="#C6FF00" text-anchor="middle">3 priorités</text>
  </g>
</svg>
