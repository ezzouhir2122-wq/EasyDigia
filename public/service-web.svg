<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD400"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <clipPath id="browserClip">
      <rect x="80" y="100" width="440" height="300" rx="18"/>
    </clipPath>
  </defs>
  <style>
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    @keyframes slideBar { from{width:0} to{width:var(--w)} }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    .browser-wrap { animation: float 6s ease-in-out infinite; }
    .cursor { animation: blink 1.2s step-end infinite; }
    .bar1 { animation: pulse 2s ease-in-out infinite; }
    .bar2 { animation: pulse 2s ease-in-out infinite .4s; }
    .bar3 { animation: pulse 2s ease-in-out infinite .8s; }
    .dot-green { fill:#C6FF00; }
  </style>

  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <circle cx="300" cy="300" r="200" fill="#8FD400" opacity="0.04" filter="url(#glow)"/>

  <!-- Browser window -->
  <g class="browser-wrap">
    <!-- Shadow -->
    <rect x="86" y="108" width="440" height="300" rx="18" fill="rgba(0,0,0,0.5)"/>
    <!-- Frame -->
    <rect x="80" y="100" width="440" height="300" rx="18" fill="#12141C" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect x="80" y="100" width="440" height="40" rx="18" fill="rgba(255,255,255,0.04)"/>
    <rect x="80" y="120" width="440" height="20" fill="rgba(255,255,255,0.04)"/>
    <!-- Traffic lights -->
    <circle cx="110" cy="120" r="6" fill="#FF5F56"/>
    <circle cx="128" cy="120" r="6" fill="#FFBD2E"/>
    <circle cx="146" cy="120" r="6" fill="#27C93F"/>
    <!-- URL bar -->
    <rect x="170" y="112" width="240" height="16" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="290" y="124" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">www.easydigia.com</text>

    <!-- Website content inside browser -->
    <!-- Nav -->
    <rect x="80" y="140" width="440" height="2" fill="rgba(255,255,255,0.05)"/>
    <rect x="100" y="152" width="60" height="8" rx="4" fill="url(#limeGrad)" opacity="0.8"/>
    <rect x="340" y="152" width="40" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="388" y="152" width="40" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="436" y="148" width="60" height="16" rx="8" fill="url(#limeGrad)"/>
    <text x="466" y="160" font-family="sans-serif" font-size="8" fill="#0A0B10" font-weight="bold" text-anchor="middle">Contact</text>

    <!-- Hero area -->
    <rect x="100" y="180" width="200" height="14" rx="6" fill="rgba(255,255,255,0.8)"/>
    <rect x="100" y="202" width="160" height="10" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="100" y="220" width="180" height="10" rx="4" fill="rgba(255,255,255,0.25)"/>
    <rect x="100" y="244" width="80" height="20" rx="8" fill="url(#limeGrad)"/>
    <text x="140" y="258" font-family="sans-serif" font-size="8" fill="#0A0B10" font-weight="bold" text-anchor="middle">Démarrer →</text>

    <!-- Hero image placeholder -->
    <rect x="340" y="175" width="160" height="110" rx="12" fill="rgba(143,212,0,0.08)" stroke="rgba(143,212,0,0.2)" stroke-width="1.5"/>
    <circle cx="420" cy="230" r="30" fill="none" stroke="url(#limeGrad)" stroke-width="2" class="bar1"/>
    <circle cx="420" cy="230" r="18" fill="rgba(143,212,0,0.15)"/>
    <circle cx="420" cy="230" r="8" fill="url(#limeGrad)" filter="url(#glow)"/>

    <!-- Service cards -->
    <rect x="100" y="300" width="120" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="230" y="300" width="120" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="360" y="300" width="120" height="70" rx="10" fill="rgba(143,212,0,0.06)" stroke="rgba(143,212,0,0.18)" stroke-width="1"/>
    <rect x="110" y="310" width="60" height="6" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="110" y="322" width="90" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="110" y="332" width="70" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="240" y="310" width="60" height="6" rx="3" fill="rgba(255,255,255,0.5)"/>
    <rect x="240" y="322" width="90" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="370" y="310" width="60" height="6" rx="3" fill="rgba(198,255,0,0.7)"/>
    <rect x="370" y="322" width="90" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Cursor blink -->
  <rect x="252" y="113" width="2" height="12" fill="#C6FF00" class="cursor"/>

  <!-- Floating tags below -->
  <g transform="translate(120,430)">
    <rect width="100" height="28" rx="14" fill="rgba(143,212,0,0.1)" stroke="rgba(143,212,0,0.3)" stroke-width="1"/>
    <text x="50" y="18" font-family="monospace" font-size="10" fill="#C6FF00" text-anchor="middle">SEO</text>
  </g>
  <g transform="translate(240,420)" style="animation:float 5s ease-in-out infinite .8s;">
    <rect width="120" height="28" rx="14" fill="rgba(143,212,0,0.1)" stroke="rgba(143,212,0,0.3)" stroke-width="1"/>
    <text x="60" y="18" font-family="monospace" font-size="10" fill="#C6FF00" text-anchor="middle">Responsive</text>
  </g>
  <g transform="translate(378,430)">
    <rect width="100" height="28" rx="14" fill="rgba(143,212,0,0.1)" stroke="rgba(143,212,0,0.3)" stroke-width="1"/>
    <text x="50" y="18" font-family="monospace" font-size="10" fill="#C6FF00" text-anchor="middle">Design</text>
  </g>

  <!-- Glow blobs -->
  <circle cx="120" cy="480" r="4" fill="#C6FF00" opacity="0.5" class="bar1" filter="url(#glow)"/>
  <circle cx="480" cy="460" r="3" fill="#8FD400" opacity="0.4" class="bar3" filter="url(#glow)"/>
</svg>
